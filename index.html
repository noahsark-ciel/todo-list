<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ToDo・持ち物</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ToDo">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15171a" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex, nofollow">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: スマホ優先。上に見出し・旅行選択・進捗、真ん中にリスト、下に入力欄とタブを固定（親指で届く）。eno-tools配色。 */
:root{
  --bg:#f6f7f9; --surface:#ffffff; --ink:#1f2328; --muted:#6b7178; --line:#dde1e5;
  --accent:#2b2f36; --accent-ink:#ffffff; --soft:#f0f2f4; --crit:#9a4a44;
  --f-display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --gx:max(16px,env(safe-area-inset-left,0px));
  --gx2:max(16px,env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15171a; --surface:#1e2125; --ink:#e6e8ea; --muted:#9aa0a6; --line:#30343a;
  --accent:#d5d9de; --accent-ink:#15171a; --soft:#272b30; --crit:#d9958d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15171a; --surface:#1e2125; --ink:#e6e8ea; --muted:#9aa0a6; --line:#30343a;
  --accent:#d5d9de; --accent-ink:#15171a; --soft:#272b30; --crit:#d9958d; color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--f-body)}
button{font-family:var(--f-body)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.wrap{max-width:720px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;gap:12px;
  padding-top:max(14px,env(safe-area-inset-top,0px));padding-left:var(--gx);padding-right:var(--gx2)}

/* 見出し */
.top{display:flex;align-items:center;gap:8px;min-height:44px}
h1{flex:1;min-width:0;margin:0;font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:.05em;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
h1 svg{width:.9em;height:.9em;vertical-align:-.1em;margin-right:.35em}
#sync{font-size:12px;color:var(--muted);white-space:nowrap}
.icon-btn{border:0;background:transparent;color:var(--muted);width:44px;height:44px;border-radius:10px;display:grid;place-items:center;cursor:pointer;flex:none}
.icon-btn:hover{color:var(--ink)}
.icon-btn svg{width:22px;height:22px}

/* ボタン・入力 */
input[type="text"],select{font:16px var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 12px;min-height:48px;min-width:0}
input[type="text"]{width:100%}
select{padding-right:6px}
input:disabled{color:var(--muted);background:var(--soft)}
.sm{font:500 14px var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:0 14px;min-height:44px;cursor:pointer}
.sm:hover{border-color:var(--accent)}
.sm.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.sm.danger{color:var(--crit)}
.sm.danger.armed{background:var(--crit);color:#fff;border-color:var(--crit)}
.sm:disabled{opacity:.45;cursor:default}
.sm:disabled:hover{border-color:var(--line)}
.sq{border:1px solid var(--line);background:var(--surface);color:var(--ink);width:48px;height:48px;border-radius:10px;display:grid;place-items:center;cursor:pointer;flex:none;font-size:20px;padding:0}
.sq.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.sq svg{width:22px;height:22px}

/* 旅行 */
.trip{display:flex;flex-direction:column;gap:10px}
.trip-row{display:flex;gap:8px;align-items:center}
.trip-row select{flex:1 1 auto;font-family:var(--f-display);font-weight:800;font-size:18px;letter-spacing:.04em}
.trip-tools{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.panel{display:flex;flex-direction:column;gap:10px;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.panel h3{margin:0;font-size:12px;font-weight:500;letter-spacing:.2em;color:var(--muted)}
.panel .row{display:flex;gap:8px;flex-wrap:wrap}
.panel .row>*{flex:1 1 160px;min-width:0}
.panel .row.btns>*{flex:0 0 auto}
.panel label.f{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:700}
.panel label.f input{font-weight:400}
.hint{font-size:13px;color:var(--muted);margin:0}
.filebtn{display:inline-flex;align-items:center}
.filebtn input{display:none}

/* 進捗 */
.progress{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.bar{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
.progress b{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--ink)}
.progress .sm{min-height:36px;padding:0 10px;font-size:13px}
#msg{color:var(--crit);font-size:14px}
#msg:empty{display:none}

/* リスト */
#lists{flex:1;padding-bottom:4px}
.group{display:flex;flex-direction:column;gap:8px}
.group+.group{margin-top:8px}
.group h2{font-size:12px;letter-spacing:.2em;color:var(--muted);margin:8px 0 0;font-weight:500}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
li{display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;min-height:56px;transition:border-color .15s}
li:hover{border-color:var(--accent)}
li{scroll-margin-bottom:180px;scroll-margin-top:90px}
li label{flex:1;min-width:0;display:flex;align-items:center;gap:14px;padding:12px 4px 12px 0;cursor:pointer}
li input[type="checkbox"]{width:24px;height:24px;accent-color:var(--accent);flex:none;margin:0}
li .t{overflow-wrap:anywhere}
li.done .t{text-decoration:line-through;color:var(--muted)}
.grip{border:0;background:transparent;color:var(--muted);cursor:grab;touch-action:none;width:38px;align-self:stretch;flex:none;padding:0;font-size:18px;line-height:1;letter-spacing:-3px}
.grip:hover{color:var(--ink)}
.edit{border:0;background:transparent;color:var(--muted);width:48px;align-self:stretch;flex:none;cursor:pointer;display:grid;place-items:center;padding:0;border-radius:0 12px 12px 0}
.edit:hover{color:var(--ink)}
.edit svg{width:20px;height:20px}
li.editing{flex-wrap:wrap;padding:10px;gap:8px;align-items:center}
li.editing input[type="text"]{flex:1 1 100%}
li.editing select{flex:1 1 40%}
li.editing .btns{display:flex;gap:8px;flex:1 1 100%;flex-wrap:wrap}
li.editing .btns .danger{margin-left:auto}
.del{border:0;background:transparent;color:var(--muted);font-size:20px;width:44px;height:44px;border-radius:8px;cursor:pointer;flex:none}
.del:hover{color:var(--crit)}
.empty{text-align:center;color:var(--muted);padding:32px 12px;border:1px dashed var(--line);border-radius:12px;font-size:15px}
.ed-list{display:flex;flex-direction:column;gap:6px;max-height:50vh;overflow-y:auto}
.ed-list .empty{padding:16px}
.ed-row{display:flex;gap:6px;align-items:center;position:relative}
.ed-row input[type="text"]{flex:1 1 auto;min-width:0}
.ed-row select{flex:0 0 auto;max-width:9em}
.ed-row .grip{height:48px;width:34px}
.ed-row .del{width:44px;height:48px}
.sortable{position:relative}
.sortable.drag{opacity:.8;z-index:2;border-color:var(--accent)}
.sortable.drop-before::before,.sortable.drop-end::after{content:"";position:absolute;left:0;right:0;height:3px;background:var(--accent);border-radius:2px;z-index:3}
.sortable.drop-before::before{top:-6px}
.sortable.drop-end::after{bottom:-6px}

/* 下に固定する入力欄とタブ */
.dock{position:sticky;bottom:0;z-index:5;margin-top:auto;
  margin-left:calc(-1 * var(--gx));margin-right:calc(-1 * var(--gx2));
  padding:10px var(--gx2) max(10px,env(safe-area-inset-bottom,0px)) var(--gx);
  background:var(--bg);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
#form{display:flex;gap:8px}
#form input[type="text"]{flex:1 1 auto}
#form select{flex:0 0 auto;max-width:8em}
.add{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font:700 16px var(--f-body);letter-spacing:.05em;border-radius:10px;padding:0 18px;min-height:48px;cursor:pointer;flex:none}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tabs button{border:1px solid var(--line);background:var(--surface);color:var(--muted);font:700 15px var(--f-body);letter-spacing:.05em;border-radius:10px;min-height:48px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.tabs button svg{width:20px;height:20px}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

@media (min-width:640px){
  .wrap{padding-top:32px}
  h1{font-size:30px}
  .dock{margin-left:0;margin-right:0;padding-left:0;padding-right:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/></svg>ToDo・持ち物</h1>
    <span id="sync" role="status">読み込み中…</span>
    <button class="icon-btn" id="setup-open" type="button" aria-label="接続設定とバックアップ"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></button>
  </header>

  <div class="panel" id="setup" hidden>
    <h3>接続設定</h3>
    <p class="hint">Googleスプレッドシートに作った保存用プログラムの「ウェブアプリのURL」と、プログラムに書いた合言葉を入れてください。手順は SETUP.md にあります。</p>
    <label class="f" for="cfg-url">ウェブアプリのURL
      <input type="text" id="cfg-url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://script.google.com/macros/s/…/exec">
    </label>
    <label class="f" for="cfg-key">合言葉
      <input type="text" id="cfg-key" autocomplete="off" autocapitalize="off" spellcheck="false">
    </label>
    <div id="setup-msg" class="hint" role="status"></div>
    <div class="row btns">
      <button class="sm primary" id="setup-connect" type="button">接続する</button>
      <button class="sm" id="setup-close" type="button" hidden>閉じる</button>
      <button class="sm" id="setup-export" type="button">バックアップを書き出す</button>
      <label class="sm filebtn">ファイルを取り込む<input type="file" id="setup-import" accept=".json,application/json"></label>
    </div>
  </div>

  <section class="trip" id="trip" hidden aria-label="旅行">
    <div class="trip-row">
      <select id="trip-sel" aria-label="旅行を選ぶ"></select>
      <button class="sq primary" id="new-trip" type="button" aria-label="新しい旅行を作る"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button>
      <button class="sq" id="more" type="button" aria-expanded="false" aria-label="その他の操作">⋯</button>
    </div>
    <div class="trip-tools" id="trip-tools" hidden>
      <button class="sm" id="edit-tpl" type="button">テンプレートを編集</button>
      <button class="sm" id="save-tpl" type="button">テンプレートとして保存</button>
      <button class="sm" id="uncheck" type="button">チェックを全部外す</button>
      <button class="sm danger" id="del-trip" type="button">この旅行を削除</button>
    </div>

    <div class="panel" id="new-panel" hidden>
      <h3>新しい旅行</h3>
      <div class="row">
        <input type="text" id="trip-name" maxlength="60" autocomplete="off" placeholder="旅行の名前（例：京都 2泊3日）" aria-label="旅行の名前">
        <select id="tpl-sel" aria-label="テンプレート"></select>
      </div>
      <p class="hint" id="tpl-hint"></p>
      <div class="row btns">
        <button class="sm primary" id="create-trip" type="button">作成</button>
        <button class="sm" id="cancel-trip" type="button">キャンセル</button>
        <button class="sm danger" id="del-tpl" type="button" hidden>このテンプレートを削除</button>
      </div>
    </div>

    <div class="panel" id="ed-panel" hidden>
      <h3>テンプレートを編集</h3>
      <div class="row">
        <select id="ed-sel" aria-label="編集するテンプレート"></select>
        <input type="text" id="ed-name" maxlength="60" autocomplete="off" placeholder="テンプレート名" aria-label="テンプレート名">
      </div>
      <p class="hint" id="ed-hint"></p>
      <div id="ed-list" class="ed-list"></div>
      <div class="row">
        <input type="text" id="ed-text" maxlength="200" autocomplete="off" placeholder="持ち物を追加" aria-label="テンプレートに持ち物を追加">
        <button class="sm" id="ed-add" type="button">追加</button>
      </div>
      <div class="row btns">
        <button class="sm primary" id="ed-save" type="button">保存</button>
        <button class="sm" id="ed-close" type="button">閉じる</button>
        <button class="sm danger" id="ed-del" type="button" hidden>このテンプレートを削除</button>
      </div>
    </div>

    <div class="panel" id="tpl-panel" hidden>
      <h3>テンプレートとして保存</h3>
      <div class="row">
        <input type="text" id="tpl-name" maxlength="60" autocomplete="off" aria-label="テンプレート名">
      </div>
      <p class="hint">この旅行の持ち物（チェックなし）を保存します。同じ名前があれば上書きします。</p>
      <div class="row btns">
        <button class="sm primary" id="tpl-ok" type="button">保存</button>
        <button class="sm" id="tpl-cancel" type="button">キャンセル</button>
      </div>
    </div>
  </section>

  <div class="progress">
    <div class="bar"><i id="fill"></i></div><span id="count"></span>
    <button class="sm" id="clear-done" type="button">完了を削除</button>
  </div>
  <div id="msg" role="alert"></div>

  <div id="lists"></div>

  <div class="dock">
    <form id="form">
      <input type="text" id="text" maxlength="200" autocomplete="off" enterkeyhint="done" aria-label="項目を追加">
      <button class="add" type="submit">追加</button>
    </form>
    <div class="tabs" role="tablist">
      <button id="tab-todo" role="tab" aria-selected="true" data-list="todo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/></svg>ToDo</button>
      <button id="tab-packing" role="tab" aria-selected="false" data-list="packing"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 20V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/><rect width="20" height="14" x="2" y="6" rx="2"/></svg>持ち物</button>
    </div>
  </div>
</div>

<script>
(function () {
  var LEGACY = "_legacy";


  var cur = location.hash === "#packing" ? "packing" : "todo";
  var items = [], trips = [], tpls = [];
  var itemsCol = null, tripsCol = null, tplsCol = null;
  var tripId = null, pendingTrip = null;
  var $ = function (id) { return document.getElementById(id); };
  var armTimer = {};

  function ls(k, v) {
    try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) {}
    return null;
  }
  function setMsg(t) { $("msg").textContent = t || ""; }
  function fail(e) {
    setMsg(e && e.code === "invalid_argument" ? "書き込み権限がありません。オーナーのアカウントで開いてください。" : "保存できませんでした。通信を確認してもう一度お試しください。");
  }

  /* 2回押しで実行する確認（confirm()は使えないため） */
  function armed(btn, msg, run) {
    btn.addEventListener("click", function () {
      if (confirm(typeof msg === "function" ? msg() : msg)) run();
    });
  }

  /* ---------- 旅行 ---------- */
  function legacyItems() { return items.filter(function (i) { return i.list === "packing" && !i.trip; }); }

  function tripList() {
    var l = trips.slice().sort(function (a, b) { return a.created - b.created; });
    if (legacyItems().length) l.push({ id: LEGACY, name: "旧リスト（旅行未設定）", created: 0 });
    return l;
  }

  function ensureTrip() {
    var l = tripList();
    if (pendingTrip && l.some(function (t) { return t.id === pendingTrip; })) pendingTrip = null;
    if (tripId && tripId === pendingTrip) return;
    if (l.some(function (t) { return t.id === tripId; })) return;
    var saved = ls("trip");
    if (l.some(function (t) { return t.id === saved; })) tripId = saved;
    else tripId = l.length ? l[l.length - 1].id : null;
  }

  function renderTrips() {
    var l = tripList(), sel = $("trip-sel");
    sel.textContent = "";
    if (!l.length) {
      var o = document.createElement("option"); o.textContent = "旅行がありません"; o.value = ""; sel.appendChild(o);
    }
    l.forEach(function (t) {
      var o = document.createElement("option"); o.value = t.id; o.textContent = t.name; sel.appendChild(o);
    });
    if (tripId) sel.value = tripId;
    sel.disabled = !l.length;
    $("save-tpl").disabled = !tripId;
    $("del-trip").disabled = !tripId;
  }

  function renderTplOptions() {
    var sel = $("tpl-sel"), prev = sel.value;
    sel.textContent = "";
    function add(v, t, parent) { var o = document.createElement("option"); o.value = v; o.textContent = t; (parent || sel).appendChild(o); }
    add("", "テンプレートなし（空のリスト）");
    if (tpls.length) {
      var g2 = document.createElement("optgroup"); g2.label = "保存したテンプレート";
      tpls.slice().sort(function (a, b) { return a.created - b.created; }).forEach(function (t) { add("u:" + t.id, t.name, g2); });
      sel.appendChild(g2);
    }
    if (prev && sel.querySelector('option[value="' + prev + '"]')) sel.value = prev;
    updateTplHint();
  }

  function tplItems(v) {
    var out = [];
    if (!v) return out;
    tpls.forEach(function (t) { if ("u:" + t.id === v) out = (t.items || []).slice(); });
    return out;
  }

  function updateTplHint() {
    var v = $("tpl-sel").value, n = tplItems(v).length;
    $("tpl-hint").textContent = v ? n + "個の持ち物が最初から入ります。作成後に追加・削除できます。" : "";
    $("del-tpl").hidden = v.indexOf("u:") !== 0;
  }

  function createTrip() {
    var name = $("trip-name").value.trim();
    if (!name || !tripsCol) { $("trip-name").focus(); return; }
    var list = tplItems($("tpl-sel").value);
    var ref = tripsCol.doc();
    var now = Date.now();

  /* box 内の .sortable をグリップでドラッグ。離したとき onDrop(動かした要素, その直後に来る要素 or null) */
  function enableSort(box, onDrop) {
    box.addEventListener("pointerdown", function (ev) {
      var grip = ev.target.closest(".grip");
      if (!grip || !box.contains(grip)) return;
      var el = grip.closest(".sortable");
      ev.preventDefault();
      var y0 = ev.clientY, s0 = window.scrollY, before = null, last = ev, raf = 0;
      var sibs = [].filter.call(box.children, function (x) { return x !== el && x.classList.contains("sortable"); });
      el.classList.add("drag");
      /* 画面の端に近づいたら自動でスクロールする（長いリストでも並べ替えられる） */
      function tick() {
        var h = window.innerHeight, y = last.clientY;
        if (y < 110) window.scrollBy(0, -14); else if (y > h - 190) window.scrollBy(0, 14);
        move(last);
        raf = requestAnimationFrame(tick);
      }
      raf = requestAnimationFrame(tick);
      function mark() {
        sibs.forEach(function (s) { s.classList.remove("drop-before", "drop-end"); });
        if (before) before.classList.add("drop-before");
        else if (sibs.length) sibs[sibs.length - 1].classList.add("drop-end");
      }
      function move(e) {
        last = e;
        el.style.transform = "translateY(" + (e.clientY - y0 + window.scrollY - s0) + "px)";
        before = null;
        for (var i = 0; i < sibs.length; i++) {
          var r = sibs[i].getBoundingClientRect();
          if (e.clientY < r.top + r.height / 2) { before = sibs[i]; break; }
        }
        mark();
      }
      function up() {
        cancelAnimationFrame(raf);
        window.removeEventListener("pointermove", move);
        window.removeEventListener("pointerup", up);
        window.removeEventListener("pointercancel", up);
        sibs.forEach(function (s) { s.classList.remove("drop-before", "drop-end"); });
        el.classList.remove("drag"); el.style.transform = "";
        onDrop(el, before);
      }
      window.addEventListener("pointermove", move);
      window.addEventListener("pointerup", up);
      window.addEventListener("pointercancel", up);
    });
  }

  function dropItem(el, before) {
    var box = el.parentElement;
    var list = [].filter.call(box.children, function (x) { return x !== el && x.classList.contains("sortable"); });
    var at = before ? list.indexOf(before) : list.length;
    var byId = function (e) { return items.filter(function (i) { return i.id === e.dataset.id; })[0]; };
    var prev = list[at - 1] && byId(list[at - 1]), next = list[at] && byId(list[at]);
    var me = byId(el);
    if (!me) return;
    var k;
    if (prev && next) k = (keyOf(prev) + keyOf(next)) / 2;
    else if (prev) k = keyOf(prev) + 1000;
    else if (next) k = keyOf(next) - 1000;
    else return;
    me.order = k;
    render();
    itemsCol.doc(me.id).update({ order: k }).catch(fail);
  }

  /* ---------- 同期 ---------- */
  /* 保存先は Google スプレッドシート（Apps Script）。家計簿と同じ仕組み。
     端末にも控えを持ち、書き込みはすぐ画面に反映して裏で送る。 */
  var CFG_KEY = "td.cfg", CACHE_KEY = "td.cache", COLS = ["items", "trips", "templates", "settings"];
  var store = { items: {}, trips: {}, templates: {}, settings: {} };
  var dirty = {}, pend = {}, inflight = {}, failed = {};
  var listeners = { items: [], trips: [], templates: [], settings: [] };
  var loading = false, setupMsg = "";

  function getCfg() { try { return JSON.parse(localStorage.getItem(CFG_KEY) || "null"); } catch (e) { return null; } }
  function setCfg(c) { try { if (c) localStorage.setItem(CFG_KEY, JSON.stringify(c)); else localStorage.removeItem(CFG_KEY); } catch (e) {} }
  function saveCache() { try { localStorage.setItem(CACHE_KEY, JSON.stringify({ store: store, dirty: dirty })); } catch (e) {} }
  function loadCache() {
    try {
      var c = JSON.parse(localStorage.getItem(CACHE_KEY) || "null");
      if (c && c.store) COLS.forEach(function (k) { store[k] = c.store[k] || {}; });
      if (c && c.dirty) dirty = c.dirty;
    } catch (e) {}
  }
  function setSync(t) { $("sync").textContent = t; }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  var api = {
    load: function (cfg) {
      var u = cfg.url + (cfg.url.indexOf("?") >= 0 ? "&" : "?") + "key=" + encodeURIComponent(cfg.key) + "&t=" + Date.now();
      return fetch(u, { cache: "no-store", redirect: "follow" }).then(function (r) { return r.json(); }).then(function (j) {
        if (!j.ok) throw { code: j.error || "error" };
        return j.docs || {};
      });
    },
    post: function (cfg, body) {
      body.key = cfg.key;
      return fetch(cfg.url, { method: "POST", redirect: "follow", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body) })
        .then(function (r) { return r.json(); }).then(function (j) {
          if (!j.ok) throw { code: j.error || "error" };
          return j;
        });
    }
  };

  function snapOf(c) {
    return { docs: Object.keys(store[c]).map(function (id) { return { id: id, data: function () { return store[c][id]; } }; }) };
  }
  function notify(c) { listeners[c].forEach(function (fn) { fn(snapOf(c)); }); }
  function notifyAll() { COLS.forEach(notify); }
  function newId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
  function anyInflight() { return Object.keys(inflight).some(function (k) { return inflight[k]; }); }
  function idle() { setSync(Object.keys(dirty).length ? (getCfg() ? "未保存あり" : "未接続") : "同期済み"); }

  function mark(path) {
    dirty[path] = true; pend[path] = true; saveCache();
    if (!inflight[path]) flush(path);
  }
  function flush(path) {
    var cfg = getCfg();
    if (!cfg) { setSync("未接続"); return Promise.resolve(); }
    inflight[path] = true; setSync("保存中…");
    var p = path.split("/");
    var step = function () {
      if (!pend[path]) { inflight[path] = false; return Promise.resolve(); }
      pend[path] = false;
      var doc = store[p[0]][p[1]];
      var body = doc ? { op: "set", path: path, data: doc } : { op: "delete", path: path };
      return api.post(cfg, body).catch(function (e) {
        if (e && e.code === "bad_key") throw e;
        return sleep(800 + Math.random() * 700).then(function () { return api.post(cfg, body); });
      }).then(function () {
        if (!pend[path]) { delete dirty[path]; delete failed[path]; saveCache(); }
      }, function (e) {
        failed[path] = true;
        setupMsg = e && e.code === "bad_key" ? "合言葉が違うため保存できませんでした。接続設定を確認してください。" : "";
        pend[path] = false;
      }).then(step);
    };
    return step().then(function () { if (!anyInflight()) idle(); });
  }
  function flushDirty() { Object.keys(dirty).forEach(function (path) { if (!inflight[path]) { pend[path] = true; flush(path); } }); }

  function applyDocs(docs) {
    var next = { items: {}, trips: {}, templates: {}, settings: {} };
    Object.keys(docs).forEach(function (p) {
      var a = p.split("/"), v = docs[p];
      if (next[a[0]] && a[1]) next[a[0]][a[1]] = (v && v.data) || v;
    });
    Object.keys(dirty).forEach(function (p) {
      var a = p.split("/");
      if (!next[a[0]]) return;
      if (store[a[0]][a[1]]) next[a[0]][a[1]] = store[a[0]][a[1]]; else delete next[a[0]][a[1]];
    });
    store = next; saveCache(); notifyAll();
  }

  function reload(quiet) {
    var cfg = getCfg();
    if (!cfg || loading || anyInflight()) return Promise.resolve();
    loading = true;
    if (!quiet) setSync("読み込み中…");
    return api.load(cfg).then(function (docs) {
      applyDocs(docs); idle(); flushDirty();
    }).catch(function (e) {
      if (e && e.code === "bad_key") { setupMsg = "合言葉が違います。接続設定から入れ直してください。"; openSetup(); setSync("接続できません"); }
      else setSync(navigator.onLine === false ? "オフライン" : "読み込めません");
    }).then(function () { loading = false; });
  }

  /* Firestore風の薄い入れ物。上のアプリ部分はこの形で読み書きする */
  function makeCol(c) {
    function docRef(id) {
      return {
        id: id,
        set: function (data) { store[c][id] = JSON.parse(JSON.stringify(data)); mark(c + "/" + id); notify(c); return Promise.resolve(); },
        update: function (patch) {
          if (!store[c][id]) return Promise.resolve();
          store[c][id] = Object.assign({}, store[c][id], patch); mark(c + "/" + id); notify(c); return Promise.resolve();
        },
        delete: function () { delete store[c][id]; mark(c + "/" + id); notify(c); return Promise.resolve(); }
      };
    }
    return {
      doc: function (id) { return docRef(id || newId()); },
      add: function (data) { var r = docRef(newId()); return r.set(data).then(function () { return r; }); },
      onSnapshot: function (fn) { listeners[c].push(fn); fn(snapOf(c)); return function () { listeners[c] = listeners[c].filter(function (x) { return x !== fn; }); }; }
    };
  }

  function docs(snap) { return snap.docs.map(function (d) { return Object.assign({}, d.data(), { id: d.id }); }); }

  itemsCol = makeCol("items"); tripsCol = makeCol("trips"); tplsCol = makeCol("templates");
  loadCache();
  itemsCol.onSnapshot(function (s) { items = docs(s); render(); });
  tripsCol.onSnapshot(function (s) { trips = docs(s); render(); });
  tplsCol.onSnapshot(function (s) {
    tpls = docs(s);
    if (!$("new-panel").hidden) renderTplOptions();
    /* 選択肢だけ更新し、編集中の内容は上書きしない */
    if (!$("ed-panel").hidden) edOptions(ed.key);
  });

  /* ---------- 接続設定 ---------- */
  function renderSetup() {
    var cfg = getCfg() || {};
    $("cfg-url").value = cfg.url || "";
    $("cfg-key").value = cfg.key || "";
    $("setup-msg").textContent = setupMsg;
    $("setup-close").hidden = !getCfg();
  }
  function openSetup() { $("setup").hidden = false; renderSetup(); window.scrollTo(0, 0); }
  $("setup-open").addEventListener("click", function () { setupMsg = ""; openSetup(); });
  $("setup-close").addEventListener("click", function () { $("setup").hidden = true; });
  $("setup-connect").addEventListener("click", function () {
    var url = $("cfg-url").value.trim(), key = $("cfg-key").value.trim();
    var m = $("setup-msg");
    if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(url)) { m.textContent = "URLは https://script.google.com/… で始まるものを入れてください。"; return; }
    if (!key) { m.textContent = "合言葉を入れてください。"; return; }
    m.textContent = "接続しています…";
    var cfg = { url: url, key: key };
    api.load(cfg).then(function (docs) {
      setCfg(cfg); setupMsg = "";
      if (Object.keys(docs).length) { applyDocs(docs); } else {
        COLS.forEach(function (c) { Object.keys(store[c]).forEach(function (id) { dirty[c + "/" + id] = true; }); });
      }
      saveCache(); flushDirty(); idle();
      $("setup").hidden = true; setMsg("接続しました。");
    }).catch(function (e) {
      m.textContent = e && e.code === "bad_key" ? "合言葉が違います。Apps Script の SECRET と同じものを入れてください。" : "接続できませんでした。URLと、デプロイの「アクセスできるユーザー：全員」を確認してください。";
    });
  });
  $("setup-export").addEventListener("click", function () {
    var out = {};
    COLS.forEach(function (c) { Object.keys(store[c]).forEach(function (id) { out[c + "/" + id] = store[c][id]; }); });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(out, null, 1)], { type: "application/json" }));
    a.download = "todo-data-" + new Date().toISOString().slice(0, 10) + ".json";
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  });
  $("setup-import").addEventListener("change", function (ev) {
    var f = ev.target.files[0]; ev.target.value = "";
    if (!f) return;
    f.text().then(function (t) {
      var j = JSON.parse(t), n = 0;
      Object.keys(j).forEach(function (p) {
        var a = p.split("/"), v = j[p];
        if (store[a[0]] && a[1] && v && typeof v === "object") { store[a[0]][a[1]] = (v.data && typeof v.data === "object" && !v.text) ? v.data : v; mark(p); n++; }
      });
      notifyAll();
      $("setup-msg").textContent = n + "件を取り込みました。";
    }).catch(function () { $("setup-msg").textContent = "取り込めませんでした。todo-data.json を選んでいるか確認してください。"; });
  });

  /* ---------- 起動 ---------- */
  if (getCfg()) { setSync("読み込み中…"); reload(); flushDirty(); } else { setSync("未接続"); openSetup(); }
  document.addEventListener("visibilitychange", function () { if (!document.hidden) reload(true); });
  window.addEventListener("online", function () { reload(true); });
  window.addEventListener("focus", function () { reload(true); });
  setInterval(function () { if (!document.hidden && !editingId) reload(true); }, 30000);
})();
</script>
</body>
</html>
